<style>
/* Layout: one-screen card table. Row of category wells on top, four index-card columns, deck + tools at thumb height. */
:root{
  --desk:#1e9c45; --well:#16843a; --well-line:#3dbb66; --ui:#ffffff; --ui-soft:#d9f7e3; --ribbon:#11752f;
  --accent:#ffd23f; --accent-ink:#3a2a00; --tool:#3d8bff; --tool-d:#2563c9; color-scheme:light;
  --paper:#fffaf0; --paper-edge:#d9d4c8; --ink:#2f3640; --ink-soft:#6a7480; --rule:#e3e7ec; --margin:#d3645a;
  --back:#2f6fe0; --back-2:#5592f7; --lk0:#ffc21a; --lk0d:#c98e00; --lk1:#ee3b3b; --lk1d:#b61f1f;
  --t0:#ef4e3a; --t1:#1f3f8f; --t2:#8a4fd6; --t3:#e8890c; --t4:#2f7ff0; --t5:#e2408c; --t6:#4f5fc9; --t7:#7a5a48;
  --good:#2e7a4e; --scrim:rgba(18,28,26,.45);
  --warn:#ffb4a0;
  --brass:#7a5208; --brass-paper:#ffd34d; --brass-ink:#4a3204; --lockveil:rgba(31,76,52,.88);
  --shadow:0 1px 0 rgba(0,0,0,.06), 0 2px 5px rgba(20,32,30,.20);
  --f-display:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-word:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --gap:8px; --cw:80px; --ch:110px; --offup:29px; --offdown:10px;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ui);font-family:var(--f-word);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.title{min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-soft)}
.lvl{font-weight:900;font-size:24px;line-height:1.1;margin-top:2px}
.stats{font-family:var(--f-mono);font-size:11.5px;color:var(--ui-soft);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.top-actions{display:flex;gap:6px;flex-shrink:0}
.btn{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:0;
  background:var(--well);color:var(--ui);border:1.5px solid var(--well-line);border-radius:12px;padding:7px 10px;cursor:pointer;line-height:1}
.btn:hover{border-color:var(--ui-soft)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tip{font-size:13px;color:var(--ui-soft);line-height:1.35;margin-top:-4px}

/* status: moves + goal */
.status{display:flex;gap:10px;align-items:stretch}
.mv,.goal{background:var(--well);border:1px solid var(--well-line);border-radius:12px;padding:6px 10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.mv{flex:1;min-width:0}
.mv-l{font-family:var(--f-display);font-weight:800;font-size:12px;color:var(--ui-soft)}
.mv-n{font-family:var(--f-mono);font-weight:900;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.mv-n.low{color:var(--warn)}
.mv-of{font-family:var(--f-mono);font-size:12px;color:var(--ui-soft)}
.mv-bar{flex-basis:100%;height:4px;border-radius:2px;background:var(--well-line);overflow:hidden}
.mv-bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.goal-n{font-family:var(--f-mono);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.goal{flex-direction:column;gap:2px;justify-content:center}
.coins{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:900;font-size:15px;padding:0 10px;border-radius:999px;background:var(--well);border:1px solid var(--well-line);font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,#e3ad2c 60%,#a8741a);box-shadow:inset 0 0 0 1.5px #b9851f;vertical-align:-2px;flex-shrink:0}
.coins.bump{animation:pop .4s ease-out}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px}
.tool small{font-family:var(--f-mono);font-weight:800;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--ui-soft);display:inline-flex;align-items:center;gap:3px}
.tool small .coin{width:10px;height:10px}
.lose .stars{color:var(--ink-soft)}

/* top bar like the original: coins + moves ribbon left, waste + deck right */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;height:var(--ch)}
.topleft{display:flex;flex-direction:column;gap:8px;min-width:0}
.topline{display:flex;align-items:flex-start;gap:8px}
.pillbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;border:0;background:rgba(0,0,0,.22);color:#fff;
  font-family:var(--f-display);font-weight:900;font-size:14px;cursor:pointer;white-space:nowrap}
.pillbtn:focus-visible,.tbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.burger{display:inline-flex;flex-direction:column;gap:3px}.burger i{display:block;width:14px;height:2.5px;border-radius:2px;background:#fff}
.coins{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 6px;border-radius:999px;background:rgba(0,0,0,.22);color:#fff;
  font-family:var(--f-display);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.coins .coin{width:20px;height:20px}
.coins.bump{animation:pop .4s ease-out}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0b3,#f4b81f 55%,#c98a10);box-shadow:inset 0 0 0 1.5px #d39612;vertical-align:-2px;flex-shrink:0}
.ribbon{background:var(--ribbon);color:#fff;width:78px;padding:5px 0 15px;text-align:center;display:flex;flex-direction:column;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
.ribbon span{font-weight:800;font-size:12px;opacity:.9}
.ribbon b{font-weight:900;font-size:27px;line-height:1.05;font-variant-numeric:tabular-nums}
.ribbon.low b{color:#ffd23f}
.goalbox{display:flex;flex-direction:column;gap:5px;padding-top:4px;min-width:0}
.glbl{font-weight:800;font-size:12px;color:var(--ui-soft);white-space:nowrap}.glbl b{color:#fff;font-weight:900}
.gsq{display:flex;flex-wrap:wrap;gap:4px;max-width:96px}
.gsq i{width:14px;height:14px;border-radius:4px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.gsq i.on{background:#fff;box-shadow:none;position:relative}
.gsq i.on::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid var(--desk);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.piles{display:flex;gap:8px;flex-shrink:0}
.pile.waste{width:calc(var(--cw) + var(--fan,14px) * 2)}
/* bottom tools: icon tiles */
.tools{display:flex;justify-content:space-around;align-items:flex-start;gap:4px;padding-bottom:2px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:#fff;cursor:pointer;font-family:var(--f-display);min-width:0}
.tbtn .tile{width:50px;height:46px;border-radius:14px;background:var(--tool);box-shadow:0 4px 0 var(--tool-d),0 6px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.tbtn .tile svg{width:28px;height:28px}
.tbtn.joker .tile{background:#ffc928;box-shadow:0 4px 0 #c98e00,0 6px 10px rgba(0,0,0,.2);border-radius:8px;width:40px;height:50px;margin-top:-4px}
.tbtn:active .tile{transform:translateY(3px);box-shadow:0 1px 0 var(--tool-d)}
.tbtn:disabled{opacity:.45;cursor:default}
.tl{font-weight:800;font-size:11.5px;margin-top:3px;white-space:nowrap}
.tp{display:inline-flex;align-items:center;gap:3px;font-weight:900;font-size:11.5px;background:rgba(0,0,0,.22);border-radius:999px;padding:1px 7px 1px 3px;white-space:nowrap}
.tp .coin{width:12px;height:12px}
#undoNote{padding:1px 7px}
.crown{width:46%;height:auto;color:rgba(255,255,255,.22)}

/* rows */
.row{display:grid;grid-template-columns:repeat(var(--nc,4),var(--cw));justify-content:space-between;column-gap:var(--gap)}
.slot{position:relative;width:var(--cw);height:var(--ch);border-radius:11px;background:var(--well);border:0;box-shadow:inset 0 3px 6px rgba(0,0,0,.18);box-sizing:border-box;
  display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:transparent;background:transparent}
.slot-empty{font-family:var(--f-display);font-weight:800;font-size:12px;color:var(--ui-soft);text-align:center;padding:4px}
.tableau{flex:1;min-height:0;align-items:start}
.col{position:relative;width:var(--cw);min-height:var(--ch)}
.col-empty{position:absolute;inset:0 0 auto 0;height:var(--ch);border-radius:11px;background:rgba(0,0,0,.1);box-sizing:border-box}
.over{outline:4px solid var(--accent);outline-offset:3px;border-radius:9px}

/* cards: white word cards, solid-colour category cards, coral backs */
.card{position:absolute;left:0;width:var(--cw);height:var(--ch);box-sizing:border-box;border-radius:10px;background:var(--paper);
  box-shadow:0 0 0 1px rgba(0,0,0,.10),0 2px 0 rgba(0,0,0,.10),0 4px 10px rgba(0,0,0,.22);color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden;font-family:var(--f-word)}
.slot .card,.pile .card{top:0}
.wtxt{position:absolute;inset:0 0 auto 0;height:var(--offup);display:flex;align-items:center;padding:0 7px;box-sizing:border-box;
  font-weight:700;font-size:calc(var(--cw) * .15);line-height:1.05;hyphens:auto;overflow-wrap:anywhere;overflow:hidden}
.wtxt.l{font-size:calc(var(--cw) * .13)}
.wtxt.x{font-size:calc(var(--cw) * .115)}
.exp .wtxt{inset:0;height:auto;justify-content:center;text-align:center;padding:8px 6px;font-size:calc(var(--cw) * .19)}
.exp .wtxt.l{font-size:calc(var(--cw) * .155)}
.exp .wtxt.x{font-size:calc(var(--cw) * .13)}
/* category card */
.cat,.slotcard{background:var(--tab);color:#fff}
.cat .tab,.slotcard .tab{position:absolute;inset:0 0 auto 0;height:var(--offup);display:flex;align-items:center;padding:0 7px;box-sizing:border-box;
  font-weight:900;font-size:calc(var(--cw) * .135);line-height:1.02;overflow:hidden;hyphens:auto;overflow-wrap:anywhere}
.cat.exp .tab{inset:0 0 auto 0;height:62%;justify-content:center;text-align:center;font-size:calc(var(--cw) * .165);padding:6px 6px 0}
.cat .meta{position:absolute;inset:auto 6px 7px 6px;display:none;flex-direction:column;align-items:center;gap:3px}
.cat.exp .meta{display:flex}
.pill{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 6px;font-weight:800;font-size:calc(var(--cw)*.105);white-space:nowrap;max-width:100%;box-sizing:border-box}
.pill.ord{background:#fff;color:var(--tab)}
.slotcard{cursor:default}
.slotcard .body{position:absolute;inset:var(--offup) 6px 7px 6px;display:flex;flex-direction:column;gap:5px}
.slotcard .cnt{font-weight:900;font-size:calc(var(--cw)*.2);line-height:1;font-variant-numeric:tabular-nums}
.slotcard .cnt small{font-size:.55em;font-weight:800;opacity:.85}
.segs{display:flex;gap:2px}
.segs i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.segs i.on{background:#fff}
.slotcard .lastw{margin-top:auto;font-weight:700;font-size:calc(var(--cw)*.12);line-height:1.1;overflow:hidden;max-height:2.3em;hyphens:auto;overflow-wrap:anywhere;opacity:.92}
/* backs */
.back{background-color:var(--back);
  background-image:linear-gradient(45deg,var(--back-2) 25%,transparent 25%,transparent 75%,var(--back-2) 75%),linear-gradient(-45deg,var(--back-2) 25%,transparent 25%,transparent 75%,var(--back-2) 75%);
  background-size:12px 12px;
  box-shadow:0 0 0 1px rgba(0,0,0,.15),0 2px 0 rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.22),inset 0 0 0 3px #fff;cursor:default}
.pile{position:relative;width:var(--cw);height:var(--ch)}
.pile-empty{position:absolute;inset:0;border-radius:11px;border:1.5px dashed var(--well-line);display:flex;align-items:center;justify-content:center;
  color:var(--ui-soft);font-weight:800;font-size:12px;text-align:center;line-height:1.3;cursor:pointer;box-sizing:border-box}
.stock .card{cursor:pointer}
.badge{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;padding:0 5px;box-sizing:border-box;border-radius:12px;background:#fff;color:var(--ink);
  font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;pointer-events:none}
.under{position:absolute;inset:0;border-radius:10px;background:var(--paper);transform:translate(3px,-3px);opacity:.7}

/* picture cards */
.pic .ptop{position:absolute;inset:0 0 auto 0;height:var(--offup);display:flex;align-items:center;padding-left:7px;box-sizing:border-box;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:calc(var(--offup) * .66);line-height:1}
.pic .pbig{display:none}
.pic.exp .ptop{display:none}
.pic.exp .pbig{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:calc(var(--cw) * .52);line-height:1}

/* keys & locks */
.key{background:var(--paper);color:var(--kc)}
.key .ktab{position:absolute;inset:0 0 auto 0;height:var(--offup);display:flex;align-items:center;padding:0 7px;box-sizing:border-box}
.key .ktab svg{height:calc(var(--offup) * .5);width:auto}
.key.exp .ktab{display:none}
.kglyph{display:none}
.key.exp .kglyph{display:block;position:absolute;left:12%;width:76%;top:30%;height:auto}
.locked{cursor:default}
.lockcard{position:absolute;left:0;width:var(--cw);height:var(--ch);box-sizing:border-box;border-radius:10px;background:var(--lc);z-index:3;
  box-shadow:0 0 0 2px var(--lcd),0 3px 0 var(--lcd),0 5px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background-image:radial-gradient(circle at 9px 9px,rgba(0,0,0,.28) 2.2px,transparent 2.6px),radial-gradient(circle at calc(100% - 9px) 9px,rgba(0,0,0,.28) 2.2px,transparent 2.6px),
  radial-gradient(circle at 9px calc(100% - 9px),rgba(0,0,0,.28) 2.2px,transparent 2.6px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),rgba(0,0,0,.28) 2.2px,transparent 2.6px)}
.lockcard::before{content:"";position:absolute;inset:7px;border-radius:7px;border:2px solid rgba(255,255,255,.45)}
.lglyph{width:46%;height:auto;color:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.lcnt{font-weight:900;font-size:calc(var(--cw)*.2);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums;line-height:1}
.lockcard.y .lcnt,.lockcard.y .lglyph{color:#7a4f00;text-shadow:none}
.unlocking .card{animation:pop .35s ease-out}
.ice-ov{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;background:linear-gradient(135deg,rgba(225,246,255,.72),rgba(150,210,245,.55) 55%,rgba(225,246,255,.7));box-shadow:inset 0 0 0 2px rgba(255,255,255,.95),inset 0 0 14px rgba(90,170,230,.75)}
.ice-ov::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 38%,transparent 46%),linear-gradient(115deg,transparent 58%,rgba(255,255,255,.45) 62%,transparent 66%)}
.ice-ov.l2{background:linear-gradient(135deg,rgba(210,240,255,.88),rgba(120,190,240,.75) 55%,rgba(210,240,255,.88))}
.ice-ov b,.chain-ov b{position:absolute;right:4px;top:3px;font-size:13px;line-height:1;color:#1b6fb5;background:#fff;border-radius:9px;padding:2px 5px;box-shadow:0 1px 3px rgba(0,0,0,.25);font-family:var(--f-display)}
.chain-ov{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;background:repeating-linear-gradient(35deg,transparent 0 10px,rgba(70,70,80,.0) 10px 12px),linear-gradient(35deg,transparent 42%,#6b7280 42% 46%,#9ca3af 46% 50%,#6b7280 50% 54%,transparent 54%),linear-gradient(-35deg,transparent 42%,#6b7280 42% 46%,#9ca3af 46% 50%,#6b7280 50% 54%,transparent 54%);box-shadow:inset 0 0 0 2px rgba(80,80,90,.5)}
.chain-ov b{color:#374151}

/* feedback */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50}
.ghost .card{box-shadow:0 10px 22px rgba(0,0,0,.35)}
.hidden-src{visibility:hidden}
.hint{outline:4px solid var(--accent);outline-offset:2px;animation:pulse 1s ease-in-out 2}
@keyframes pulse{50%{outline-offset:6px}}
.shake{animation:shake .32s ease}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9)}}
.flip{animation:flip .3s ease-out}
@keyframes flip{from{transform:rotateY(85deg)}}
.complete{animation:done .7s ease forwards}
@keyframes done{0%{transform:scale(1)}30%{transform:scale(1.08);box-shadow:0 0 0 4px var(--good)}100%{transform:scale(.6);opacity:0;box-shadow:0 0 0 4px var(--good)}}
@media (prefers-reduced-motion: reduce){.hint,.shake,.pop,.flip{animation:none}.complete{animation:fade .3s forwards}@keyframes fade{to{opacity:0}}}

/* overlays: bright header band, big numbers, chunky buttons */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--ch) + 30px + env(safe-area-inset-bottom, 0px));z-index:40;
  background:#fff;color:#2f3640;border-radius:16px;box-shadow:0 0 0 3px #ffd23f,0 10px 28px rgba(0,0,0,.3);
  padding:13px 15px;width:min(360px, calc(100% - 32px));box-sizing:border-box;font-weight:800;font-size:15px;line-height:1.4}
.toast .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.toast .btn{background:#eaf2ff;color:#2f6fe0;border:0;border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 3px 0 #c7dafc}
.toast .btn.primary{background:var(--tool);color:#fff;box-shadow:0 3px 0 var(--tool-d)}
.ov{position:fixed;inset:0;background:rgba(10,40,20,.6);z-index:60;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px}
.sheet{background:#fffaf0;color:#2f3640;border-radius:24px;box-shadow:0 0 0 4px #fff,0 24px 60px rgba(0,0,0,.45);width:min(400px,100%);max-height:100%;overflow:auto;box-sizing:border-box;animation:sheetIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes sheetIn{from{transform:scale(.85);opacity:0}}
.band{background:linear-gradient(180deg,#ffbf3b,#ff8a1f);color:#fff;text-align:center;padding:18px 16px 16px}
.band.blue{background:linear-gradient(180deg,#58a0ff,#2f6fe0)}
.band.red{background:linear-gradient(180deg,#ff7466,#e0392b)}
.band .eyebrow{color:rgba(255,255,255,.92);font-weight:900;font-size:13px;letter-spacing:.1em}
.band h2{color:#fff;font-weight:900;font-size:28px;line-height:1.15;margin:4px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.18);text-wrap:balance}
.bigstars{font-size:54px;line-height:1;letter-spacing:6px;color:#fff3a3;text-shadow:0 3px 0 #c76d00,0 0 18px rgba(255,240,150,.8);margin-top:10px}
.bigstars .st{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars .st:nth-child(2){animation-delay:.25s}.bigstars .st:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}}
/* tablet: 5 columns, bigger chrome */
.wide .app{max-width:980px;gap:16px}
.wide .pillbtn{height:44px;font-size:18px;padding:0 16px}
.wide .burger i{width:18px;height:3px}
.wide .coins{height:44px;font-size:21px;padding:0 16px 0 8px}.wide .coins .coin{width:28px;height:28px}
.wide .ribbon{width:110px;padding:8px 0 22px}.wide .ribbon span{font-size:16px}.wide .ribbon b{font-size:40px}
.wide .glbl{font-size:16px}.wide .gsq{max-width:150px;gap:6px}.wide .gsq i{width:20px;height:20px;border-radius:5px}
.wide .gsq i.on::after{left:6.5px;top:2.5px;width:5px;height:10px}
.wide .topline{gap:12px}.wide .topleft{gap:12px}
.wide .tip{font-size:17px}
.wide .tools{justify-content:center;gap:34px}
.wide .tbtn .tile{width:72px;height:66px;border-radius:20px}.wide .tbtn .tile svg{width:40px;height:40px}
.wide .tbtn.joker .tile{width:56px;height:72px;border-radius:11px}
.wide .tl{font-size:15px}.wide .tp{font-size:14px}.wide .tp .coin{width:15px;height:15px}
.wide .lcnt{font-size:calc(var(--cw)*.17)}
.wide .badge{min-width:32px;height:32px;border-radius:16px;font-size:15px}
.wide .toast{font-size:17px;width:min(440px, calc(100% - 32px))}
.wide .sheet{width:min(480px,100%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion: reduce){.bigstars .st,.sheet{animation:none}}
.bigstars .st.off{color:rgba(255,255,255,.35);text-shadow:0 3px 0 rgba(0,0,0,.12)}
.sbody{padding:16px 18px 18px}
.sbody p,.sbody li{font-weight:700;font-size:15.5px;line-height:1.45;margin:8px 0;color:#3d4550}
.sbody ul{padding-left:20px;margin:6px 0}
.sbody li::marker{color:#2f6fe0}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:16px;box-shadow:0 0 0 2px #f1e6cf;padding:10px 8px;text-align:center}
.stat .k{display:block;font-weight:800;font-size:13px;color:#7a8390}
.stat .v{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:28px;line-height:1.15;color:#2f3640;font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;color:#7a8390}
.stat.gold .v{color:#d78a00}.stat.gold .coin{width:24px;height:24px}
.note{font-weight:700;font-size:13.5px!important;color:#6f7884!important;text-align:center}
.acts2{display:flex;gap:10px;margin-top:16px}
.sbtn{flex:1;font-family:var(--f-display);font-weight:900;font-size:17px;border:0;border-radius:16px;padding:14px 10px;cursor:pointer;color:#fff;background:var(--tool);box-shadow:0 4px 0 var(--tool-d)}
.sbtn.go{background:#22b14c;box-shadow:0 4px 0 #157a33}
.sbtn.soft{background:#eaf2ff;color:#2f6fe0;box-shadow:0 4px 0 #c7dafc}
.sbtn.gold{background:#ffc928;color:#5a3b00;box-shadow:0 4px 0 #c98e00}
.sbtn:active{transform:translateY(3px);box-shadow:none}
.sbtn:disabled{opacity:.45;cursor:default}
.sbtn:focus-visible,.lv:focus-visible{outline:3px solid #2f6fe0;outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.lv{border:0;background:#fff;color:#2f3640;border-radius:14px;padding:9px 2px 6px;cursor:pointer;font-family:var(--f-display);font-weight:900;font-size:18px;

  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.started){
    if(Math.hypot(dx,dy)<7)return;
    drag.started=true;
    const g=document.createElement('div');g.className='ghost';
    const r0=drag.el.getBoundingClientRect();drag.r0=r0;
    drag.ids.forEach(id=>{const src=document.querySelector(`[data-id="${id}"][data-src]`)||document.querySelector(`[data-id="${id}"]`);if(!src)return;
      const r=src.getBoundingClientRect();const c=src.cloneNode(true);c.style.top=(r.top-r0.top)+'px';c.style.left='0px';c.classList.remove('pop','flip','hint');g.appendChild(c);src.classList.add('hidden-src')});
    document.body.appendChild(g);drag.ghost=g;
  }
  drag.ghost.style.transform=`translate(${drag.r0.left+dx}px,${drag.r0.top+dy}px)`;
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const d=under&&under.closest('[data-drop]');
  if(drag.over&&drag.over!==d)drag.over.classList.remove('over');
  if(d){const tg=parse(d.dataset.drop);if(canDrop(drag.ids,drag.src,tg)){d.classList.add('over');drag.over=d}else drag.over=null}
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  if(!d.started)return;
  if(d.over)d.over.classList.remove('over');
  d.ghost.remove();
  if(!cancel){
    const under=document.elementFromPoint(e.clientX,e.clientY);const t=under&&under.closest('[data-drop]');
    if(t){const tg=parse(t.dataset.drop);if(canDrop(d.ids,d.src,tg)){perform(d.src,tg);return}}
  }
  render();
  if(!cancel){const el=document.querySelector(`[data-id="${d.ids[0]}"]`);shake(el);orderMsg(d.ids)}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

const PRICE={hint:25,shuffle:30,joker:60,moves:50};
function pay(kind,what){
  if(kind==='hint'&&S&&S.freeHints>0){S.freeHints--;saveGame();return true}
  const c=PRICE[kind];
  if(PROG.coins<c){toast(`Не хватает монет: ${what} стоит ${c}, у вас ${PROG.coins}. Монеты дают за пройденные уровни.`);return false}
  PROG.coins-=c;if(S)S.helped=true;saveProg();const el=$('#coins');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');$('#coinN').textContent=PROG.coins;return true;
}
function joker(){
  if(busy)return;hideToast();
  if(!jokerPlan()){toast('Джокеру сейчас некуда положить карту.');return}
  if(!pay('joker','джокер'))return;
  pushHist();const r=applyJoker();
  fresh=new Set();flipId=r.revealed;render();saveGame();
  const c=S.cards[r.id];toast(c.t==='c'?`Джокер выложил категорию «${c.text}».`:`Джокер положил «${c.text}» в «${S.cats[c.c].name}».`);
  if(r.completed>=0){onCatDone(r.completed);burstAtSlot(r.completed);busy=true;setTimeout(()=>{finishSlot(r.completed);busy=false;render();saveGame();after()},720)}else after();
}
function hint(){
  if(busy)return;hideToast();
  { const ms0=allMoves();if(!(ms0.length||drawProductive())){stuckToast();return} if(!pay('hint','подсказка'))return; }
  const ms=allMoves();const best=ms[0];
  const mark=el=>{if(!el)return;el.classList.remove('hint');void el.offsetWidth;el.classList.add('hint');setTimeout(()=>el.classList.remove('hint'),2100)};
  if(best&&best.score>=20){
    const src=best.src.k==='col'?document.querySelector(`[data-src="col:${best.src.i}:${best.src.idx}"]`):wasteEl.querySelector('.card');
    mark(src);
    const tgEl=document.querySelector(`[data-drop="${best.tg.k}:${best.tg.i}"]`);
    mark(best.tg.k==='lock'?(tgEl&&tgEl.querySelector('.lock')):best.tg.k==='slot'?tgEl:(tgEl&&(tgEl.lastElementChild&&tgEl.lastElementChild.classList.contains('card')?tgEl.lastElementChild:tgEl.firstElementChild)));
  }else if(drawProductive()){
    mark(stockEl.querySelector('.card,.pile-empty'));
    toast('Нужная карта лежит в колоде — тяните.');
  }else if(best){
    const src=best.src.k==='col'?document.querySelector(`[data-src="col:${best.src.i}:${best.src.idx}"]`):wasteEl.querySelector('.card');mark(src);
  }else stuckToast();
}
function reshuffle(){
  if(busy)return;const pool=S.stock.concat(S.waste);
  if(pool.length<2){toast('В колоде нечего перемешивать.');return}
  if(!pay('shuffle','перемешивание'))return;
  hideToast();pushHist();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  S.stock=pool;S.waste=[];render();saveGame();toast('Колода перемешана. Ход не потрачен.');
}
function restart(){if(busy)return;if(!dailyMode&&S&&S.moves>0&&PROG.streak){PROG.streak=0;saveProg()}if(dailyMode)loadLevel(dailyNum(),false,true);else loadLevel(S.L,false)}

const FX_COLORS=['#ffd23f','#ef4e3a','#2f7ff0','#8a4fd6','#e2408c','#ff8a1f','#ffffff','#22b14c'];
let fxParts=[],fxRun=false;
function confetti(x,y,n){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  let cv=document.getElementById('fx');
  if(!cv){cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv)}
  const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*(n>60?9:6);
    fxParts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(n>60?6:4),r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:4+Math.random()*5,
      c:FX_COLORS[i%FX_COLORS.length],life:n>60?150:70,star:Math.random()<.25})}
  if(fxRun)return;fxRun=true;const ctx=cv.getContext('2d');
  const step=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    fxParts=fxParts.filter(p=>p.life-->0&&p.y<innerHeight+20);
    for(const p of fxParts){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.c;
      if(p.star){ctx.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.w*.35:p.w*.8,aa=k*Math.PI/5;ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}ctx.fill()}
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(fxParts.length)requestAnimationFrame(step);else{fxRun=false;ctx.clearRect(0,0,innerWidth,innerHeight)}};
  requestAnimationFrame(step);
}

    [-1,1].forEach(d=>s+=`<path d="M${d*70} -104l${-d*10} -6v12zM${d*70} -104l${d*10} -6v12z" fill="#e9a0ad"/><circle cx="${d*70}" cy="-104" r="3" fill="#e08a99"/>`);return s}

  return `<g opacity=".97">${s}</g>`};

function realRoom(room,stOf,prev){
  const cfg=RCFG[room.id]||{kind:room.bg==='out'?'out':room.bg==='glass'?'glass':room.bg==='attic'?'attic':room.bg==='cellar'?'cellar':room.bg==='veranda'?'veranda':'in'};

  const bt=room.tasks.find(t=>bgKind(t)),bst=(bt&&stOf(bt))||'old';
  let s=cfg.kind==='out'?shellOut(bst,cfg):cfg.kind==='glass'?shellGlass(bst):cfg.kind==='attic'?shellAttic(bst):cfg.kind==='cellar'?shellCellar(bst):cfg.kind==='veranda'?shellVeranda(bst):shellIn(bst,cfg);

    t.items.forEach((it,j)=>{const name=it[0];if(!R[name])return;const o=OV[t.id]&&OV[t.id][j];let X,Y,K;
      if(o)[X,Y,K]=o;else{[X,Y,K]=(out?mapOut:mapIn)(it[1],it[2]);if(HANG[name]){Y=20+it[2]*1.667;K=1}K*=Math.min(1,it[3]||1);if(name==='rug')K*=.68}
      let tr=`translate(${X.toFixed(1)} ${Y.toFixed(1)}) scale(${K.toFixed(3)})`;

  return `<svg viewBox="0 0 640 400" role="img" aria-label="${room.name}">${s}${L.map(i=>i.g).join('')}${vignette()}</svg>`;

/* ---------- Звуки ---------- */
let AC=null;
const SFX={place:[[520,.05]],flip:[[740,.035]],cat:[[660,.08],[880,.09],[1320,.16]],win:[[523,.11],[659,.11],[784,.11],[1047,.32]],err:[[170,.12]],unlock:[[440,.08],[740,.14]],coin:[[988,.06],[1319,.14]],lose:[[392,.16],[330,.16],[262,.32]]};
function sfx(k){
  if(PROG.sound===false)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    let at=AC.currentTime+.01;
    (SFX[k]||[]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=(k==='err'||k==='lose')?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.16,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.03);at+=d*.8});
  }catch(e){}
}

  const t=today();

    const pool=QUESTS.slice(),list=[],ev={};

    PROG.quests={date:t,list,bonus:0};saveProg();

}
function questEv(ev,n){const Q=questsToday(),done=[];Q.list.forEach(x=>{const d=qdef(x.id);if(d.ev===ev&&x.p<d.goal){x.p=Math.min(d.goal,x.p+(n||1));if(x.p>=d.goal)done.push(d.text)}});if(done.length)saveProg();return done}
